name: refresh-video-link
on:
  schedule:
    - cron: "7,37 * * * *"   # 每30分钟刷新一次CDN链接
  workflow_dispatch:          # 允许手动触发
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 refresh.py
      - name: commit videos + status.json
        run: |
          git config user.name "refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos status.json
          git diff --cached --quiet || git commit -m "refresh links"
          git push
