<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,
maximum-scale=1,user-scalable=no">
<title>视频播放</title>
<style>
 html,body{margin:0;padding:0;background:#000;height:100%;
           font-family:sans-serif}
 /* —— 播放模式：全屏内嵌官方播放器 —— */
 #player-box{position:fixed;inset:0;display:none;
             flex-direction:column;background:#000}
 #player-box iframe{flex:1;width:100%;border:0;min-height:0}
 #bar{color:#777;font-size:12px;text-align:center;padding:8px 10px;
      background:#111;line-height:1.6}
 #bar a{color:#4a9eff;text-decoration:none}
 /* —— 列表模式 —— */
 #list-page{display:none;background:#0f1115;color:#eee;
            min-height:100vh;box-sizing:border-box;padding:24px 0;
            text-align:center}
 #list-page h3{font-weight:500;padding:0 16px;font-size:16px}
 #list-page .tip{color:#889;font-size:12px;margin-top:12px;
                 padding:0 12px;line-height:1.8}
 .item{display:block;width:86vw;max-width:560px;margin:10px auto;
       padding:16px;background:#1c2130;border-radius:10px;color:#eee;
       text-decoration:none;font-size:15px;box-sizing:border-box;
       text-align:left}
 .item:active{background:#2a3247}
</style></head>
<body>
<div id="player-box">
  <iframe id="pf" allowfullscreen
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          scrolling="no"></iframe>
  <div id="bar">若未自动播放，点一下屏幕中间的 ▶ 播放键 ·
    <a id="open-ext" href="#" target="_blank">无法播放？点这里</a></div>
</div>
<div id="list-page">
  <h3 id="t">视频库</h3>
  <div class="tip" id="tip">加载中…</div>
  <div id="list"></div>
</div>
<script>
// 单视频: ?v=BV号&p=分P —— 在本页内嵌B站官方播放器。
// 关键设计：顶层网址始终是本页(github.io)，微信只拦截顶层域名，
// 不会拦截页面内嵌的 player.bilibili.com，因此微信扫码可直接播放。
var qs=new URLSearchParams(location.search),
    key=qs.get('v'), page=parseInt(qs.get('p')||'1');
if(key){
  var src='https://player.bilibili.com/player.html?bvid='
    +encodeURIComponent(key)+'&page='+page
    +'&autoplay=1&high_quality=1&danmaku=0';
  document.getElementById('player-box').style.display='flex';
  document.getElementById('pf').src=src;
  document.getElementById('open-ext').href=src;
  document.title='视频播放';
}else{
  document.getElementById('list-page').style.display='block';
  fetch('videos/index.json?t='+Date.now())
   .then(function(r){return r.json()}).then(function(d){
     document.getElementById('t').textContent=
       '视频库（共 '+d.videos.length+' 个）';
     document.getElementById('tip').textContent=
       d.videos.length?'点击任意视频观看':'视频库为空';
     d.videos.forEach(function(it){
       var a=document.createElement('a');
       a.className='item';
       a.href='?v='+encodeURIComponent(it.key)+'&p='+(it.page||1);
       a.textContent='▶ '+(it.title||it.key);
       document.getElementById('list').appendChild(a);
     });
   }).catch(function(){
     document.getElementById('tip').textContent='加载失败，请刷新重试'});
}
</script>
</body></html>
